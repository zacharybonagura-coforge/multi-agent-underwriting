[project]
name = "multi-agent-underwriting"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "pgvector==0.3.6",
    "psycopg[binary]==3.2.3",
    "pydantic==2.12.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8==7.3.0",
    "mypy==2.3.1",
    "pytest==8.3.3",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]

[tool.uv]
required-version = ">=0.12.10,<0.13"
package = false

[tool.uv.build-backend]
module-root = ""

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: live host run scored against the golden set",
]

[tool.pyright]
extraPaths = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]